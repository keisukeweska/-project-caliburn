name: Project Caliburn Auto Bot

on:
  workflow_dispatch: # 手動実行ボタン用
  schedule:
    - cron: '0 0 * * *' # 毎日自動実行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Verdandi (News Fetcher)
        run: python verdandi.py

      - name: Run Excalibur (AI Article Generator)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python excalibur.py

      - name: Commit and push generated article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/latest_comparison.md
          git commit -m "Auto-generate comparison article [skip ci]" || exit 0
          git push
