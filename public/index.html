<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>厳選デジタルツール比較・公式案内</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 30px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .card h2 { margin-top: 0; color: #38bdf8; font-size: 1.25rem; }
        .price { font-size: 0.95rem; color: #cbd5e1; background: #0f172a; padding: 8px 12px; border-radius: 6px; margin: 10px 0; }
        ul { padding-left: 20px; font-size: 0.9rem; color: #94a3b8; }
        li { margin-bottom: 6px; }
        .btn { display: block; text-align: center; background: #2563eb; color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>おすすめ厳選ツール・サービス</h1>
        <div id="service-list">読み込み中...</div>
    </div>

    <script>
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('service-list');
                container.innerHTML = '';
                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h2>${item.name}</h2>
                        <p><strong>${item.title}</strong></p>
                        <div class="price">料金: ${item.pricing} / 無料枠: ${item.free_tier}</div>
                        <ul>
                            ${item.features.map(f => `<li>${f}</li>`).join('')}
                        </ul>
                        <a href="${item.affiliate_link}" class="btn" target="_blank" rel="noopener">公式ページで詳細を見る 〉</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('service-list').innerText = 'データの読み込みに失敗しました。';
            });
    </script>
</body>
</html>
